name: Firmware release and browser installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    container: espressif/idf:v5.3.4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require a release tag
        run: test "${GITHUB_REF_TYPE}" = tag
      - name: Build tested P4 configuration
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -C firmware/viewesmart-p4 build
          python tools/package-release.py --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: release/
      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python tools/publish-release.py
